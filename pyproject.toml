[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recr"
version = "0.1.0"
description = "Recover unused space in compiled binaries without changing their layout."
readme = "README.md"
requires-python = ">=3.10"
license = "(MIT OR Unlicense) AND Apache-2.0"
license-files = ["LICENSE", "UNLICENSE", "LICENSE-Ghidra", "NOTICE-Ghidra"]
dependencies = ["pyelftools>=0.31", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
codezip = "codezip:main"
recr = "recr:main"

[tool.setuptools]
py-modules = ["cache", "codezip", "input_parser", "ir", "recr", "uplifter"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["binary", "gpu", "isa", "isa.*", "optimizers", "parsers", "recompiler"]
namespaces = false

[tool.setuptools.package-data]
"isa.riscv" = ["ghidra/*.sla"]
"isa.x86_64" = ["ghidra/*.sla"]
gpu = ["kernels.cu"]
